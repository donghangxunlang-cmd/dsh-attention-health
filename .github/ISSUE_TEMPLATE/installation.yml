name: 安装与交接体验
description: 反馈真实安装成功、安装失败或交接体验；无需提供私人日志。
title: "[安装体验] "
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请只填版本和复现步骤。不要上传完整日志、交接文档、真实会话 ID、绝对路径或带 token 的页面地址。
        本表也接受成功安装的反馈；合成演示与真实 DSH 使用请分别注明。
  - type: dropdown
    id: result
    attributes:
      label: 结果
      options:
        - 真实 DSH 安装与复制交接均成功
        - 安装或加载失败
        - 复制失败或交接内容不足
        - 仅运行合成演示
    validations:
      required: true
  - type: textarea
    id: versions
    attributes:
      label: 环境与版本
      description: 操作系统、Node、DSH、pnpm、插件版本；安装来源（npm / GitHub / tgz）。不知道的写未知。
    validations:
      required: true
  - type: textarea
    id: experience
    attributes:
      label: 操作与结果
      description: 是否重启 DSH、是否看到复制入口、是否复制成功、下一会话缺了哪些信息。报错只贴人工检查过的必要部分。
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 提交前检查
      options:
        - label: 我已检查内容，不含私人日志、会话标识、访问 token 或其他敏感信息。
          required: true
