# Bundle patch layer（包内自带，2026-09-18 标准包化）
#
# 一行同时装入两面：
#   · 该行按**包名**解析到本包 package.json，加载它的 `main`（lib/index.js）
#     作为 host 半 —— 一个普通 Cordis 插件；
#   · 包内 `dsh.client.platform: "web"` + `exports["./client"]` 让 web 外壳
#     把 lib/client.js 作为**浏览器半**加载（`dsh-client-modules` 自己处理，
#     不需要第二行）。
#
# 对照本机已安装的标准样例：`~/.dsh/profiles/web/node_modules/dsh-context/cordis.patch.yml`
# 全文就是同样一行。
- insert:
    - id: attention-health
      name: dsh-attention-health
